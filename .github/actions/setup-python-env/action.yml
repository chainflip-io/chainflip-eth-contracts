name: Setup Python environment
description: Installs python3-venv, Poetry 1.4.1, and solc 0.8.20

runs:
  using: composite
  steps:
    - name: Install Python virtualenv
      shell: bash
      run: |
        for attempt in 1 2 3; do
          sudo apt-get -o Acquire::Retries=3 update
          if sudo apt-get -o Acquire::Retries=3 install -y --fix-missing python3-venv; then
            break
          fi
          if [ "$attempt" = "3" ]; then
            exit 1
          fi
          sleep $((attempt * 10))
        done
        pip install virtualenv

    - name: Install and configure Poetry
      uses: snok/install-poetry@76e04a911780d5b312d89783f7b1cd627778900a
      with:
        version: "1.4.1"

    - name: Install solc
      shell: bash
      run: |
        mkdir -p ~/.solcx
        curl -fL https://github.com/ethereum/solidity/releases/download/v0.8.20/solc-static-linux -o ~/.solcx/solc-v0.8.20
        chmod +x ~/.solcx/solc-v0.8.20
